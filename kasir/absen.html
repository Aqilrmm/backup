<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Absensi Face Recognition</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #2e8bff, #6b73ff);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 2rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 2rem;
      margin-top: 2rem;
      width: 90%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    video {
      border-radius: 1rem;
      width: 100%;
      height: auto;
      margin-bottom: 1rem;
    }

    .status {
      font-size: 1.2rem;
      font-weight: bold;
      color: #aaffaa;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      background-color: #00c896;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .btn:hover {
      background-color: #00a07a;
    }
  </style>
</head>
<body>

  <h1>Absensi Wajah</h1>
  <div class="container">
    <video id="video" autoplay muted></video>
    <div class="status" id="status">Menunggu deteksi wajah...</div>
    <button class="btn" onclick="startFaceRecognition()">Mulai Absensi</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        video.srcObject = stream;
      } catch (err) {
        statusDiv.innerText = 'Gagal mengakses kamera.';
        console.error(err);
      }
    }

    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js/models';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      statusDiv.innerText = 'Model berhasil dimuat!';
    }

    async function startFaceRecognition() {
      statusDiv.innerText = 'Memulai deteksi wajah...';

      await loadModels();
      await startCamera();

      video.addEventListener('play', () => {
        const canvas = faceapi.createCanvasFromMedia(video);
        document.querySelector('.container').append(canvas);
        const displaySize = { width: video.width, height: video.height };
        faceapi.matchDimensions(canvas, displaySize);

        setInterval(async () => {
          const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
          const resized = faceapi.resizeResults(detections, displaySize);
          canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
          faceapi.draw.drawDetections(canvas, resized);

          if (detections.length > 0) {
            statusDiv.innerText = `Wajah terdeteksi - ${detections.length} orang`;
          } else {
            statusDiv.innerText = 'Tidak ada wajah terdeteksi.';
          }
        }, 1000);
      });
    }
  </script>
</body>
</html>
