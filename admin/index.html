<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            
        }
        .sidebar {
            width: 250px;
            border: 1px solid #e2e4e6;
            margin: 10px 0;
            border-radius: 10px;
            padding-top: 20px;
        }
        .sidebar a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            padding: 10px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #a0a0a0;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            margin: 10px;
            border: 1px solid #e2e4e6;
            border-radius: 10px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center">Admin Panel</h4>
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </div>
    <div class="content">
        <h2>Dashboard</h2>
        <p>Welcome to the admin panel.</p>
    </div>
</body>
</html>
